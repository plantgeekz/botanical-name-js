name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  jsr:
    runs-on: ubuntu-latest
    name: Publish to JSR
    permissions:
      contents: read
      id-token: write # JSR authenticates with GitHub OIDC - no secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx jsr publish
